name: Signed native packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag at this commit on main
        required: true
        type: string
      publish:
        description: Publish verified packages to GitHub Releases
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-signed-release
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected main and an existing matching release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true &&
             "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          [[ "v$(jq -r '.version' package.json)" == "$RELEASE_TAG" ]]

  sign:
    name: Sign (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: verify-tag
    environment: release-signing
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32, arch: x64, runner: windows-2025 }
          - { platform: win32, arch: arm64, runner: windows-11-arm }
          - { platform: darwin, arch: x64, runner: macos-15-intel }
          - { platform: darwin, arch: arm64, runner: macos-15 }
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=high --ignore-scripts
      - run: npm test
      - run: npm run check:art
      - name: Build Authenticode-signed Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$WIN_CSC_LINK" || -z "$WIN_CSC_KEY_PASSWORD" ]]; then
            printf '%s\n' 'Windows signing requires WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.' >&2
            exit 1
          fi
          npm run package -- --arch "$TARGET_ARCH" --signed
      - name: Build and notarize macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_ID" ||
                -z "$APPLE_APP_SPECIFIC_PASSWORD" || ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            printf '%s\n' 'macOS signing requires Developer ID credentials and APPLE_TEAM_ID.' >&2
            exit 1
          fi
          npm run package -- --arch "$TARGET_ARCH" --signed
      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: npm run package -- --arch "$TARGET_ARCH"
      - name: Verify bundled runtime and stage packages
        shell: bash
        run: |
          node .github/scripts/check-bundled-bridge.cjs "$TARGET_ARCH"
          node .github/scripts/package-artifacts.cjs stage "$TARGET_PLATFORM" "$TARGET_ARCH" dist/packages dist/verified
      - name: Verify published Windows signer identity
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
        run: ./.github/scripts/verify-authenticode.ps1 -Architecture "$env:TARGET_ARCH"
      - name: Notarize disk image and verify both macOS distributions
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash .github/scripts/verify-mac-release.sh
      - name: Sign and verify Linux distributions
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
          LINUX_SIGNING_FINGERPRINT: ${{ vars.LINUX_SIGNING_FINGERPRINT }}
        run: bash .github/scripts/sign-linux-packages.sh
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/verified/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/verified/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: inputs.publish
    needs: sign
    environment: release-publishing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verified-*
          path: dist/release
          merge-multiple: true
      - name: Verify every artifact came from this signed build and exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/package-artifacts.cjs complete-release dist/release
          for asset in dist/release/*; do
            if [[ "$asset" == dist/release/SHA256SUMS.txt ]]; then continue; fi
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/signed-packages.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          (cd dist/release && sha256sum --check SHA256SUMS.txt)
      - name: Publish approved signed release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true &&
             "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" == "$GITHUB_SHA" ]]
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag --draft --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
